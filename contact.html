    <section class="page">

        <h1>Contact</h1>

        <p class="contact-intro">
            Interested in improving your BIM workflows, Revit standards,
            automation tools or project delivery process?
        </p>

        <p class="contact-email">
            Contact us directly at
            <a href="mailto:info@tdeckersprojects.com">

        </p>

        <form>

            <input
                type="text"
                placeholder="Name"

                type="text"

                placeholder="Email"

            <button type="submit">
                Send Message
            </button>

        </form>
